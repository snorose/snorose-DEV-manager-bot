name: Deploy to Lambda (ECR)

on:
  push:
    branches: [ "develop", "main" ]

# OIDC 인증을 위한 권한 설정
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push to ECR, and Deploy to Lambda
    runs-on: ubuntu-latest

    # 브랜치에 따라 사용할 환경 선택
    environment: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # AWS 자격 증명 설정
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    # Amazon ECR 로그인
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # Docker 이미지 빌드 및 푸시
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build --provenance=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile .

        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # Lambda 함수 업데이트
    - name: Deploy new image to AWS Lambda
      run: |
        aws lambda update-function-code \
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
          --image-uri ${{ steps.build-image.outputs.image_uri }}

    # 코드 업데이트가 완료될 때까지 대기
    - name: Wait for Lambda function update to complete
      run: |
        aws lambda wait function-updated \
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}

    # Lambda 환경 변수 설정
    # update-function-configuration은 환경변수 맵 전체를 덮어쓴다.
    # 여기에 없는 변수는 배포 때마다 유실되므로, 콘솔에서 수동으로 추가하지 말고
    # 반드시 이 목록에 함께 넣어야 한다.
    - name: Update Lambda Environment Variables
      run: |
        aws lambda update-function-configuration \
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
          --timeout 600 \
          --environment "Variables={ \
            DISCORD_PUBLIC_KEY=${{ vars.DISCORD_PUBLIC_KEY }}, \
            ACTIVE_TEAMS_BUCKET=${{ vars.ACTIVE_TEAMS_BUCKET || 'snorose-dev-bucket' }}, \
            ACTIVE_TEAMS_KEY=${{ vars.ACTIVE_TEAMS_KEY || 'dev-manager/active-teams.json' }}, \
            ASG_NAME=${{ vars.ASG_NAME || 'snorose-dev-application-asg' }}, \
            FCK_NAT_NAME=${{ vars.FCK_NAT_NAME || 'snorose-dev-an2-fck-nat' }}, \
            WARP_NAME=${{ vars.WARP_NAME || 'WARPConnector-dev' }}, \
            NAT_READINESS_DOCUMENT=${{ vars.NAT_READINESS_DOCUMENT || 'snorose-dev-fck-nat-ready' }}, \
            WARP_READINESS_DOCUMENT=${{ vars.WARP_READINESS_DOCUMENT || 'snorose-dev-warp-ready' }} \
          }"

    - name: Wait for Lambda configuration update to complete
      run: |
        aws lambda wait function-updated \
          --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}

    # Discord slash command registration
    - name: Register Discord slash commands
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
      run: |
        python -m pip install -r commands/requirements.txt
        python commands/register_commands.py
